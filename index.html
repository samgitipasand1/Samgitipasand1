<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam Gitipasand</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }

/* دکمه‌های بالا */
.top-nav { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 10px; }
.btn-ctrl { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 10px; border-radius: 50%; cursor: pointer; }

/* متن خوش آمد */
.welcome-msg { text-align: center; padding: 15px; color: #00d4ff; font-size: 1.2rem; }

/* گالری پیانویی */
.piano-gallery { display: flex; height: 50vh; width: 100%; }
.item { flex: 1; overflow: hidden; transition: 0.5s; cursor: pointer; border-right: 1px solid #000; }
.item img { width: 100%; height: 100%; object-fit: cover; }
.item:hover { flex: 4; }

/* پنل شیشه‌ای پایین */
.glass-panel {
background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px);
border-radius: 30px 30px 0 0; margin-top: -50px; padding: 30px;
position: relative; z-index: 5; text-align: center;
}

.name-title { font-size: 2rem; letter-spacing: 2px; color: #00d4ff; margin-bottom: 20px; }

/* دکمه‌های تب */
.tab-btns { display: flex; flex-direction: column; gap: 10px; }
.tab-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 15px; border-radius: 25px; cursor: pointer; }
.tab-btn.active { background: #00d4ff; color: #000; font-weight: bold; }

/* محتوای تب */
.tab-content { display: none; margin-top: 20px; padding: 15px; text-align: left; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<div class="top-nav">
<button class="btn-ctrl"><i class="fas fa-language"></i></button>
<button class="btn-ctrl"><i class="fas fa-moon"></i></button>
</div>

<div class="welcome-msg">Welcome to my website</div>

<div class="piano-gallery">
<div class="item"><img src="1sam.jpg"></div>
<div class="item"><img src="3sam.jpg"></div>
<div class="item"><img src="4sam.jpg"></div>
<div class="item"><img src="5sam.jpg"></div>
<div class="item"><img src="7sam.jpg"></div>
</div>

<div class="glass-panel">
<div class="name-title">SAM GITIPASAND</div>

<div class="tab-btns">
<button class="tab-btn active" onclick="showTab('about')">About Me</button>
<button class="tab-btn" onclick="showTab('series')">Series & Commercials</button>
<button class="tab-btn" onclick="showTab('skills')">Skills</button>
</div>

<div id="about" class="tab-content active"><h3>About Me</h3><p>Actor & Model based in...</p></div>
<div id="series" class="tab-content"><h3>TV Series</h3><p>Marz, Negin-e-Arbab, Berta...</p></div>
<div id="skills" class="tab-content"><h3>Skills</h3><p>Swimming, Basketball, Gymnastics...</p></div>
</div>

<script>
function showTab(id) {
document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.getElementById(id).style.display = 'block';
event.currentTarget.classList.add('active');
}
</script>
</body>
</html>
